name: Android APK - Barbearia Gold Demo
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android-demo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Configure Android SDK (preinstalled on GitHub runner)
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          test -d "$ANDROID_SDK_ROOT" || { echo "Android SDK missing"; exit 1; }
          echo "Android SDK found at $ANDROID_SDK_ROOT"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare static website
        run: npm run prepare:web
      - name: Generate Android project
        run: npx cap add android
      - name: Apply Gold logo as Android launcher icon
        shell: bash
        run: |
          python3 -m pip install --quiet --break-system-packages cairosvg pillow
          python3 scripts/android-icon.py
      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Barbearia-Gold-Demo-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
